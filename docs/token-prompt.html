<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilterRule Token</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #11111b;
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  input {
    width: 100%; max-width: 280px;
    background: #11111b;
    border: 1px solid #313244;
    border-radius: 5px;
    color: #cdd6f4;
    padding: 6px 8px;
    font-size: 11px;
    font-family: monospace;
    outline: none;
  }
  input:focus { border-color: #cba6f7; }
</style>
</head>
<body>
  <input id="tok" type="password" autocomplete="current-password"
    placeholder="点击选择钥匙串中的 token…"
    oninput="parent.postMessage({type:'rc-token',token:this.value},'*')">
</body>
</html>
