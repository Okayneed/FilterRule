name: Update Office365 Rules

on:
  schedule:
    # 北京时间每天早上 6 点运行 (UTC 时间 22 点)
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run generation script
        run: |
          python scripts/generate_o365.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 检查是否有文件变动
          if [ -n "$(git status --porcelain)" ]; then
            git add list/o365_cn.list
            git commit -m "Auto update Office 365 CN rules"
            git push
            echo "Rules updated and pushed."
          else
            echo "No changes detected."
          fi

# ... 前面的步骤不变 ...

      - name: Run generation scripts
        run: |
          python scripts/generate_o365.py
          python scripts/generate_apple.py   # <--- 新增这一行

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 同时添加两个文件
          git add list/o365_cn.list list/apple_cn.list
          
          # 只有当有变动时才提交
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto update Rules"
            git push
            echo "Rules updated."
          else
            echo "No changes."
          fi

# ... 前面的步骤不变 ...

      - name: Run generation scripts
        run: |
          python scripts/generate_o365.py
          python scripts/generate_apple.py
          python scripts/generate_proxy_apps.py  # <--- 新增 Google/Telegram
          python scripts/generate_gfw.py         # <--- 新增 GFW

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加所有新生成的文件
          git add list/o365_cn.list list/apple_cn.list list/google.list list/telegram.list list/gfw.list
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto update All Rules"
            git push
            echo "Rules updated."
          else
            echo "No changes."
          fi
