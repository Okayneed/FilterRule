name: Update All Rules

on:
  schedule:
    # 北京时间每天早上 6 点运行 (UTC 时间 22 点)
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 准备 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3. 安装依赖库 (requests)
      - name: Install dependencies
        run: |
          pip install requests

      # 4. 运行所有生成脚本 (按顺序执行)
      - name: Run generation scripts
        run: |
          python scripts/generate_o365.py
          python scripts/generate_apple.py
          python scripts/generate_proxy_apps.py
          python scripts/generate_gfw.py

      # 5. 提交并推送到仓库
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 将所有生成的 list 文件加入暂存区
          git add list/o365_cn.list list/apple_cn.list list/google.list list/gfw.list
          
          # 检查是否有文件变动，有变动才提交，没变动则跳过
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto update All Rules"
            git push
            echo "✅ Rules updated and pushed."
          else
            echo "⚠️ No changes detected."
          fi
